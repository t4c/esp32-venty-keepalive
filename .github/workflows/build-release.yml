name: Build and Release ESP32 Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Compile ESP32 Firmware with PlatformIO
        run: |
          pio run -e esp32dev

      - name: Prepare Binaries and Merge Binary for Easy Flashing
        run: |
          mkdir -p release_bin
          cp .pio/build/esp32dev/firmware.bin release_bin/esp32-venty-keepalive-firmware.bin
          cp .pio/build/esp32dev/bootloader.bin release_bin/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin release_bin/partitions.bin
          cp .pio/build/esp32dev/boot_app0.bin release_bin/boot_app0.bin 2>/dev/null || true
          
          # Create single factory merged binary (offset 0x0) for web flashers & single-file flashing
          esptool.py --chip esp32 merge_bin -o release_bin/esp32-venty-keepalive-factory-merged.bin \
            0x1000 .pio/build/esp32dev/bootloader.bin \
            0x8000 .pio/build/esp32dev/partitions.bin \
            0x10000 .pio/build/esp32dev/firmware.bin

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          path: release_bin/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_bin/esp32-venty-keepalive-factory-merged.bin
            release_bin/esp32-venty-keepalive-firmware.bin
            release_bin/bootloader.bin
            release_bin/partitions.bin
          draft: false
          prerelease: false
          generate_release_notes: true
